name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test --if-present

      - name: Build application
        run: npm run build

      - name: Smoke test production build
        run: |
          npm start -- -p 3000 > /tmp/test-api.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true; cat /tmp/test-api.log' EXIT

          curl --fail --silent --show-error \
            --retry 20 \
            --retry-all-errors \
            --retry-delay 1 \
            http://127.0.0.1:3000/ >/dev/null

          curl --fail --silent --show-error \
            http://127.0.0.1:3000/api >/dev/null
