name: Prepare Dependabot rollup
on:
  push:
    branches: [chore/dependabot-rollup-oct-2026]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Reconcile dependency versions
        run: |
          npm install --package-lock-only --ignore-scripts
          npm update --package-lock-only --ignore-scripts
          npm audit fix --ignore-scripts || true
      - name: Verify existing production security gate
        run: npm audit --omit=dev --audit-level=high
      - run: npm ci --ignore-scripts
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): consolidated lockfile and vulnerability fixes"
            git push
          fi
