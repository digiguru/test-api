name: Migrate ESLint 10 flat config

on:
  push:
    branches:
      - dependabot/npm_and_yarn/eslint-10.8.1

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Replace legacy Next ESLint config
        run: |
          npm pkg delete devDependencies.eslint-config-next
          npm install --save-dev --package-lock-only --ignore-scripts --no-audit --no-fund \
            @eslint/js@10.0.1 \
            @next/eslint-plugin-next@16.3.1 \
            @eslint-react/eslint-plugin@5.18.6 \
            eslint-plugin-react-hooks@7.1.1 \
            globals@17.7.0

          rm -f .eslintrc.json

          cat > eslint.config.mjs <<'EOF'
          import js from '@eslint/js';
          import eslintReact from '@eslint-react/eslint-plugin';
          import nextPlugin from '@next/eslint-plugin-next';
          import { defineConfig } from 'eslint/config';
          import reactHooks from 'eslint-plugin-react-hooks';
          import globals from 'globals';

          export default defineConfig([
            {
              ignores: ['.next/**', 'out/**', 'node_modules/**', 'coverage/**']
            },
            {
              files: ['**/*.{js,jsx,mjs,cjs}'],
              extends: [
                js.configs.recommended,
                eslintReact.configs.recommended,
                reactHooks.configs.flat.recommended,
                nextPlugin.configs['core-web-vitals']
              ],
              languageOptions: {
                ecmaVersion: 'latest',
                sourceType: 'module',
                parserOptions: {
                  ecmaFeatures: {
                    jsx: true
                  }
                },
                globals: {
                  ...globals.browser,
                  ...globals.node
                }
              }
            }
          ]);
          EOF

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json eslint.config.mjs
          git add -u .eslintrc.json
          git commit -m "fix: migrate to ESLint 10 flat config"
          git push
